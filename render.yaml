build:
  owner: mishra-naveen-dev
  repo: tas-backend
  branch: main
  pythonVersion: "3.14.3"
  buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --no-input
  outputDir: backend

services:
  - type: web
    name: tas-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --no-input
    startCommand: cd backend && python manage.py migrate --fake-initial && python manage.py create_test_users && python manage.py seed_features && python manage.py seed_designations && python manage.py seed_zone_data && DJANGO_SETTINGS_MODULE=traveling_allowance.settings gunicorn traveling_allowance.wsgi:application --workers 2 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromGroup: tas-database
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "tas-backendnew.onrender.com"