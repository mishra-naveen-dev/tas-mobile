name: Android Release Build & Upload

# Every push to main is expected to have bumped versionCode/versionName in
# android/app/build.gradle first (the developer workflow this repo follows).
# This builds a signed release APK with the real release keystore (never the
# debug one), verifies its signature and version before anything is
# uploaded, and pushes it to the private S3 bucket via a short-lived OIDC
# role — no long-lived AWS keys stored in GitHub at all.
on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for AWS OIDC (aws-actions/configure-aws-credentials)
  contents: read

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: tas-mobile-apk-releases-namra

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # Keystore lives only on this ephemeral runner for the duration of the
      # build — decoded from a base64 secret, never committed, never logged.
      - name: Restore release signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/tas-release-key.keystore
          # Property names must match exactly what android/app/build.gradle's
          # signingConfigs.release block reads via keystoreProperties[...].
          cat > android/keystore.properties <<EOF
          storeFile=tas-release-key.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # If this hits the same Nitro CMake ordering issue seen on Windows
      # local builds, add an isolated `:react-native-nitro-modules:assembleRelease`
      # step before the full build here (see tas-mobile's own build.gradle
      # comments for context) — untested on Linux runners as of writing.

      - name: Verify APK signature is the release key, not debug
        id: verify
        run: |
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          FINGERPRINT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep 'SHA-256 digest' | awk '{print $NF}')
          if [ "$FINGERPRINT" != "${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}" ]; then
            echo "::error::APK signature does not match the expected release certificate. Refusing to publish."
            exit 1
          fi
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -1

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "s3_key=android/production/$VERSION_NAME/TAS-Mobile-$VERSION_NAME-$VERSION_CODE.apk" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload APK to private S3
        run: |
          aws s3 cp \
            android/app/build/outputs/apk/release/app-release.apk \
            "s3://${{ env.S3_BUCKET }}/${{ steps.version.outputs.s3_key }}"

      # TODO (Phase 6, not built yet): call the backend's mobile-version
      # registration endpoint here with version_name/version_code/s3_key/
      # release_notes so the app can discover this release. Left as a
      # placeholder until that endpoint exists — the APK is safely in S3
      # either way, this step just wires up discovery.
      # - name: Register release with backend
      #   run: |
      #     curl -sf -X POST "https://api.tas.namracred.co.in/api/v1/organization/mobile-version/register/" \
      #       -H "X-Deploy-Secret: ${{ secrets.BACKEND_DEPLOY_SECRET }}" \
      #       -H "Content-Type: application/json" \
      #       -d '{"version_name":"${{ steps.version.outputs.name }}","version_code":${{ steps.version.outputs.code }},"s3_key":"${{ steps.version.outputs.s3_key }}"}'

      - name: Clean up signing credentials from runner
        if: always()
        run: rm -f android/app/tas-release-key.keystore android/keystore.properties
