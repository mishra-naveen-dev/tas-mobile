name: Android Release Build & Upload

# Pipeline verified — builds automatically on every push to main (expects
# versionCode/versionName to already be bumped in that push, per the
# developer workflow this repo follows), and can still be triggered manually
# via workflow_dispatch (e.g. to re-run without a new commit).
#
# The APK is built with the real release keystore, verified, and then
# uploaded to the private S3 bucket using AWS OIDC.
#
# No long-lived AWS access keys are stored in GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: tas-mobile-apk-releases-namra
  AWS_ROLE_ARN: arn:aws:iam::065094258042:role/GitHubActions-TAS-Mobile-Release

jobs:
  build-and-release:
    name: Build, Verify and Upload TAS Mobile APK
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Node.js
      # ------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ------------------------------------------------------------
      # 3. Java 17
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ------------------------------------------------------------
      # 4. Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 5. Verify build environment
      # ------------------------------------------------------------
      - name: Verify build environment
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

      # ------------------------------------------------------------
      # 6. Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------
      # 6b. Cache Gradle + native build outputs
      #
      # The dominant cost in this build is native C++ compilation
      # (Nitro modules, Nitro Sound, the app's own native code — each
      # across 4 ABIs), not JS/dependency work. Gradle's build cache
      # (enabled in gradle.properties) can skip re-running those
      # CMake/NDK tasks entirely when their inputs are unchanged, but
      # only if the cache actually survives between runs — that's what
      # this step does. Keyed on everything that can invalidate a
      # native build (lockfile, every build.gradle, the wrapper
      # version); a cache miss just means "same as today," never a
      # broken build — worst case is a normal from-scratch compile.
      - name: Cache Gradle & native build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ------------------------------------------------------------
      # 7. Restore release keystore
      #
      # The keystore exists only on the temporary GitHub runner.
      # It is reconstructed from the encrypted GitHub secret.
      # ------------------------------------------------------------
      - name: Restore release signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/tas-release-key.keystore

          test -s android/app/tas-release-key.keystore

          cat > android/keystore.properties <<EOF
          storeFile=tas-release-key.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Release signing files restored successfully."

      # ------------------------------------------------------------
      # 8. Build signed release APK
      # ------------------------------------------------------------
      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --parallel

      # ------------------------------------------------------------
      # 9. Verify APK exists
      # ------------------------------------------------------------
      - name: Verify APK exists
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # ------------------------------------------------------------
      # 10. Verify release certificate
      #
      # Confirms the built APK was actually signed with the release
      # keystore restored in step 7 — the expected fingerprint is read
      # directly from that keystore (via keytool) rather than from a
      # separately-recorded secret, so this can never drift out of
      # sync with whatever keystore/alias is actually in use.
      # ------------------------------------------------------------
      - name: Verify APK release certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="android/app/tas-release-key.keystore"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"

          echo "APK certificate:"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

          APK_FINGERPRINT=$(
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" |
            grep "SHA-256 digest" |
            awk '{print $NF}' |
            tr -d ':[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )

          KEYSTORE_FINGERPRINT=$(
            keytool -list -v \
              -keystore "$KEYSTORE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" |
            grep "SHA256:" |
            awk '{print $2}' |
            tr -d ':[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )

          echo ""
          echo "Comparing APK certificate with release keystore certificate..."

          if [ -z "$APK_FINGERPRINT" ]; then
            echo "::error::Could not read APK certificate fingerprint."
            exit 1
          fi

          if [ -z "$KEYSTORE_FINGERPRINT" ]; then
            echo "::error::Could not read release keystore certificate fingerprint."
            exit 1
          fi

          if [ "$APK_FINGERPRINT" != "$KEYSTORE_FINGERPRINT" ]; then
            echo "::error::APK certificate does not match the release keystore."
            echo "::error::Release upload has been blocked."
            exit 1
          fi

          echo "Release certificate verified successfully."

      # ------------------------------------------------------------
      # 11. Verify package name and version
      #
      # First release must be:
      #
      # package      = com.tasmobile
      # versionCode  = 30
      # versionName  = 1.29
      # ------------------------------------------------------------
      - name: Verify APK package and version
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"

          APK_INFO=$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -1)

          echo "APK information:"
          echo "$APK_INFO"

          echo "$APK_INFO" | grep -q "package: name='com.tasmobile'" || {
            echo "::error::APK package name is not com.tasmobile."
            exit 1
          }

          echo "$APK_INFO" | grep -q "versionCode='30'" || {
            echo "::error::APK versionCode is not 30."
            exit 1
          }

          echo "$APK_INFO" | grep -q "versionName='1.29'" || {
            echo "::error::APK versionName is not 1.29."
            exit 1
          }

          echo "APK package and version verified successfully."

      # ------------------------------------------------------------
      # 12. Verify Gradle version
      # ------------------------------------------------------------
      - name: Verify Gradle version configuration
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle | head -1)

          echo "Gradle versionName: $VERSION_NAME"
          echo "Gradle versionCode: $VERSION_CODE"

          if [ "$VERSION_NAME" != "1.29" ]; then
            echo "::error::Expected versionName 1.29 but found $VERSION_NAME."
            exit 1
          fi

          if [ "$VERSION_CODE" != "30" ]; then
            echo "::error::Expected versionCode 30 but found $VERSION_CODE."
            exit 1
          fi

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          S3_KEY="android/production/$VERSION_NAME/TAS-Mobile-$VERSION_NAME-$VERSION_CODE.apk"

          echo "s3_key=$S3_KEY" >> "$GITHUB_OUTPUT"

          echo "S3 key:"
          echo "$S3_KEY"

      # ------------------------------------------------------------
      # 13. Configure AWS using GitHub OIDC
      #
      # No AWS access key or secret key is stored in GitHub.
      # ------------------------------------------------------------
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------
      # 14. Verify AWS identity
      # ------------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------------
      # 15. Upload APK to private S3
      # ------------------------------------------------------------
      - name: Upload APK to private S3
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          S3_KEY="${{ steps.version.outputs.s3_key }}"

          echo "Uploading:"
          echo "$APK"

          echo "To:"
          echo "s3://${S3_BUCKET}/${S3_KEY}"

          aws s3 cp \
            "$APK" \
            "s3://${S3_BUCKET}/${S3_KEY}" \
            --region "$AWS_REGION" \
            --content-type "application/vnd.android.package-archive"

      # ------------------------------------------------------------
      # 16. Verify uploaded S3 object
      # ------------------------------------------------------------
      - name: Verify S3 upload
        run: |
          S3_KEY="${{ steps.version.outputs.s3_key }}"

          aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "$S3_KEY" \
            --region "$AWS_REGION"

          echo "S3 upload verified successfully."

      # ------------------------------------------------------------
      # 17. Clean signing credentials
      #
      # Always executes, even when an earlier step fails.
      # ------------------------------------------------------------
      - name: Clean up signing credentials
        if: always()
        run: |
          rm -f android/app/tas-release-key.keystore
          rm -f android/keystore.properties

          echo "Signing credentials removed from runner."