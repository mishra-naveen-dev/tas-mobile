buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        playServicesLocationVersion = "20.0.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    configurations.all {
        resolutionStrategy {
            force "com.google.android.gms:play-services-location:20.0.0"
        }
    }
}

// Windows-only: several third-party native modules (react-native-nitro-sound
// confirmed) configure their own CMake build under this project's long,
// space-containing path ("F:/d drive/Data/traveling-allowanc-system-2/...")
// and hit a CMake/Ninja "manifest still dirty after 100 tries" reconfigure
// loop as a result — the same class of problem the app module already works
// around below with its own buildStagingDirectory override. That override
// only covers :app; this applies the same fix to every other module with a
// CMake build, since node_modules itself can't be patched directly (wiped on
// every npm install). Skips :app so its existing, already-working override
// is left untouched.
if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
    subprojects { subproject ->
        if (subproject.name == 'app') return
        afterEvaluate {
            def cmake = subproject.hasProperty('android') ? subproject.android.externalNativeBuild?.cmake : null
            if (cmake != null && cmake.path != null) {
                cmake.buildStagingDirectory = new File("C:/rnbuild/tasmobile-modules/${subproject.name}")
            }
        }
    }
}
